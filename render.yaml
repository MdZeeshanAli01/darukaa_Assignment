services:
  - type: web
    name: darukaa-api
    runtime: python
    buildCommand: pip install uv && uv sync --frozen && uv run python -c "from darukaa_assignment.knowledge.documents import ingest_all_documents; print(len(ingest_all_documents()))"
    startCommand: uv run uvicorn darukaa_assignment.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: VECTOR_DB_PATH
        value: /opt/render/project/src/data/vector_store
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/darukaa.db

  - type: web
    name: darukaa-streamlit
    runtime: python
    buildCommand: pip install uv && uv sync --frozen && uv run python -c "from darukaa_assignment.knowledge.documents import ingest_all_documents; print(len(ingest_all_documents()))"
    startCommand: uv run streamlit run src/darukaa_assignment/ui/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: VECTOR_DB_PATH
        value: /opt/render/project/src/data/vector_store
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/darukaa.db
