[project]
name = "darukaa-assignment"
version = "0.1.0"
description = "AI Biodiversity Intelligence Chatbot for the Darukaa Earth Hackathon"
readme = "README.md"
authors = [
    { name = "Md Zeeshan Ali", email = "sszeeshu@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=3.2.1",
    "chromadb>=0.5.20",
    "streamlit>=1.37.0",
    "sqlalchemy>=2.0.32",
    "pandas>=2.2.3",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "langchain-text-splitters>=0.2.2",
    "pymupdf>=1.24.10",
    "beautifulsoup4>=4.12.3",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.6.0",
    "python-docx>=1.2.0",
]

[project.scripts]
darukaa-assignment = "darukaa_assignment.main:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
